<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Forza Gaming</title>
  <meta name="description" content="Sign in to your demo Forza Gaming account to sync favorites, saved articles and your dashboard. Frontend demo only.">
  <meta property="og:title" content="Sign in — Forza Gaming">
  <meta property="og:description" content="Sign in to your demo Forza Gaming account to sync favorites, saved articles and your dashboard. Frontend demo only.">
  <meta property="og:image" content="https://picsum.photos/seed/forza-og/1200/630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="login">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="siteNav"></div>

  <main id="main" class="auth-wrap">
    <div class="container">
      <div class="auth-card mx-auto reveal">
        <div class="text-center mb-4">
          <span class="chip chip-violet mb-3"><i class="bi bi-shield-lock"></i>Demo authentication</span>
          <h1 class="mb-2">Welcome back</h1>
          <p class="text-muted-fg mb-0">Everything here runs in your browser. No account data ever leaves this device.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email address</label>
            <input class="form-control" type="email" id="loginEmail" name="email" autocomplete="email"
                   placeholder="player@forza.demo" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <input class="form-control" type="password" id="loginPassword" name="password"
                   autocomplete="current-password" placeholder="Your demo password" required>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label" for="rememberMe">Keep me signed in</label>
            </div>
            <a class="small" href="forgot-password.html">Forgot password?</a>
          </div>
          <button class="btn btn-neon w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i>Sign in</button>
        </form>

        <div class="or-split my-4"><span>or use a demo account</span></div>

        <div class="row g-2">
          <div class="col-sm-6">
            <button class="btn btn-ghost w-100" type="button" data-demo-login="member">
              <i class="bi bi-person"></i>Member
            </button>
          </div>
          <div class="col-sm-6">
            <button class="btn btn-ghost w-100" type="button" data-demo-login="admin">
              <i class="bi bi-shield-check"></i>Administrator
            </button>
          </div>
        </div>

        <div class="glass p-3 mt-3 small">
          <p class="mb-1"><strong>Member:</strong> player@forza.demo · demo1234</p>
          <p class="mb-0"><strong>Admin:</strong> admin@forza.demo · admin123</p>
        </div>

        <p class="text-center small text-dim mt-4 mb-0">
          New around here? <a href="register.html">Create a demo account</a>
        </p>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaming news — Forza Gaming</title>
  <meta name="description" content="Gaming news across PC, PlayStation, Xbox, Nintendo, mobile, esports, hardware and the wider industry.">
  <meta property="og:title" content="Gaming news — Forza Gaming">
  <meta property="og:description" content="Patches, releases, hardware and industry reporting, filtered by platform.">
  <meta property="og:image" content="https://picsum.photos/seed/forza-og/1200/630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="news">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="siteNav"></div>

  <main id="main">
    <header class="page-banner">
      <div class="container">
        <nav class="crumbs mb-3" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>News</span></nav>
        <div class="rule"></div>
        <h1 class="mb-2">The newsroom</h1>
        <p class="mb-0">Eighteen stories across eight beats. Filter to the platform you care about.</p>
      </div>
    </header>

    <section class="section-tight">
      <div class="container">
        <div class="row g-3 g-lg-4 mb-4" id="newsFeatured"></div>

        <div class="glass p-3 p-lg-4 mb-4">
          <div class="row g-3 align-items-end">
            <div class="col-lg-5">
              <label class="form-label" for="searchNews">Search stories</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control" id="searchNews" placeholder="Headline, author or keyword">
              </div>
            </div>
            <div class="col-lg-3">
              <label class="form-label" for="newsSort">Order</label>
              <select class="form-select" id="newsSort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
              </select>
            </div>
          </div>
          <div class="divider"></div>
          <div class="pill-row" id="newsFilters" role="group" aria-label="Filter by category"></div>
        </div>

        <p class="text-dim small mb-3" id="newsCount" role="status" aria-live="polite"></p>
        <div class="row g-4" id="newsGrid"></div>

        <div class="text-center mt-4">
          <button class="btn btn-neon" id="loadMoreNews" hidden>Load more stories</button>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js"></script>
  <script src="js/news.js"></script>
</body>
</html>

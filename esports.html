<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esports — Forza Gaming</title>
  <meta name="description" content="Tournaments, teams, players and results across the competitive calendar.">
  <meta property="og:title" content="Esports — Forza Gaming">
  <meta property="og:description" content="Tournaments, teams, players and results across the competitive calendar.">
  <meta property="og:image" content="https://picsum.photos/seed/forza-og/1200/630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="esports">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="siteNav"></div>

  <main id="main">
    <header class="page-banner">
      <div class="container">
        <nav class="crumbs mb-3" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Esports</span></nav>
        <div class="rule"></div>
        <h1 class="mb-2">Esports</h1>
        <p class="mb-0">Four active circuits, six teams to watch, and a results feed that updates through the season.</p>
      </div>
    </header>

    <section class="section-tight">
      <div class="container">
        <div class="section-head">
          <div><div class="rule"></div><h2>Tournaments</h2></div>
        </div>
        <div class="row g-3 g-lg-4" id="tournamentGrid"></div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="section-head">
          <div><div class="rule"></div><h2>Match centre</h2></div>
        </div>
        <ul class="nav nav-tabs-fg mb-3" id="matchTabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-match-tab="all" type="button">All matches</button></li>
          <li class="nav-item"><button class="nav-link" data-match-tab="live" type="button"><i class="bi bi-broadcast me-1"></i>Live</button></li>
          <li class="nav-item"><button class="nav-link" data-match-tab="upcoming" type="button">Upcoming</button></li>
          <li class="nav-item"><button class="nav-link" data-match-tab="finished" type="button">Results</button></li>
        </ul>
        <div id="matchList"></div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="section-head">
          <div><div class="rule"></div><h2>Teams</h2></div>
        </div>
        <div class="row g-3" id="teamGrid"></div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="section-head">
          <div><div class="rule"></div><h2>Player ratings</h2></div>
        </div>
        <div class="glass p-2 p-lg-3">
          <div class="table-responsive">
            <table class="table-fg table-responsive-stack">
              <thead>
                <tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Team</th><th scope="col">Role</th><th scope="col">Rating</th></tr>
              </thead>
              <tbody id="playerTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
